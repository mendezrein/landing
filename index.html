        /* --- LAYER 0: GAME OF LIFE CANVAS --- */
        #golCanvas {

            left: 0;
            width: 100%;
            height: 100%;
            z-index: -2;
            opacity: 0.6;

        /* --- LAYER 1: FROST BLUR --- */

            position: fixed;

            backdrop-filter: blur(8px); 
            -webkit-backdrop-filter: blur(8px);
            background: radial-gradient(circle at center, rgba(18,18,18,0.5) 0%, rgba(18,18,18,0.85) 100%);
            pointer-events: none;
            transition: opacity 0.3s ease;

        /* --- RIVA TUNER OSD STYLE MONITOR --- */
        .osd-monitor {
            position: fixed;
            top: 15px;

            font-family: 'Share Tech Mono', 'Courier New', monospace;
            font-size: 13px;
            color: #ffffff;

        .osd-row {

        /* Interactive Toggle Style */
        .osd-row.clickable {

            padding: 2px 4px;

    <script>
        // --- Logic: Random Visitors ---
        const visitorCount = document.getElementById('visitorCount');
        function updateVisitors() {
            visitorCount.textContent = Math.floor(Math.random() * 5) + 1;
        }
        updateVisitors();
        setInterval(updateVisitors, 60000);

        // --- Logic: Skill Bar Animations ---
        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    const bar = entry.target;
                    const target = bar.getAttribute('data-value');
                    bar.style.transition = "width 1.5s cubic-bezier(0.22, 1, 0.36, 1)";
                    bar.style.width = target + "%";
                    observer.unobserve(bar);
                }
            });
        }, { threshold: 0.1 });

        document.querySelectorAll('.skill-fill').forEach(bar => {
            observer.observe(bar);
        });

        // --- Logic: Endless Game of Life & Monitor ---
        const canvas = document.getElementById('golCanvas');
        const ctx = canvas.getContext('2d', { alpha: false });

        // OSD Elements
        const osdFrost = document.getElementById('osd-frost');
        const frostToggleBtn = document.getElementById('frost-toggle');
        const frostLayer = document.querySelector('.frost-ambient');

        const osdFps = document.getElementById('osd-fps');
        const osdFt = document.getElementById('osd-ft');
        const osdAlive = document.getElementById('osd-alive');
        const osdMem = document.getElementById('osd-mem');
        const osdRes = document.getElementById('osd-res');

        let width, height;
        let cellSize = 15; 
        let cols, rows;
        let grid, nextGrid;
        let frameCounter = 0;
        
        let fpsFrameCount = 0;
        let lastFpsUpdate = 0;
        let lastTime = 0;

        // Frost Toggle Logic
        let frostEnabled = true;
        frostToggleBtn.addEventListener('click', () => {
            frostEnabled = !frostEnabled;
            if (frostEnabled) {
                frostLayer.style.opacity = '1';
                osdFrost.textContent = "ON";
                osdFrost.style.color = "#fff";
            } else {
                frostLayer.style.opacity = '0';
                osdFrost.textContent = "OFF";
                osdFrost.style.color = "#555";
            }
        });

        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
            cols = Math.ceil(width / cellSize);
            rows = Math.ceil(height / cellSize);
            initGrid();
            osdRes.textContent = `${width}x${height}`;
        }

        function initGrid() {
            grid = new Uint8Array(cols * rows);
            nextGrid = new Uint8Array(cols * rows);
            seed(0.15); 
        }

        function seed(density = 0.1) {
            for (let i = 0; i < cols * rows; i++) {
                if (grid[i] === 0 && Math.random() < density) {
                    grid[i] = 1;
                }
            }
        }

        function injectLife() {
            const clusterX = Math.floor(Math.random() * (cols - 10));
            const clusterY = Math.floor(Math.random() * (rows - 10));
            for (let y = 0; y < 10; y++) {
                for (let x = 0; x < 10; x++) {
                    if (Math.random() > 0.5) {
                        const idx = (clusterY + y) * cols + (clusterX + x);
                        grid[idx] = 1;
                    }
                }
            }
        }

        // --- INTERACTION LOGIC ---
        function handleInteraction(e) {
            // Prevent clicking logic if touching a link or the OSD button
            if (e.target.closest('a') || e.target.closest('.clickable')) return;

            let cx, cy;
            if (e.touches && e.touches.length > 0) {
                cx = e.touches[0].clientX;
                cy = e.touches[0].clientY;
            } else {
                cx = e.clientX;
                cy = e.clientY;
            }

            const gx = Math.floor(cx / cellSize);
            const gy = Math.floor(cy / cellSize);
            
            // Inject a small explosion (3x3 grid) at touch point
            let revived = false;
            for(let y = -1; y <= 1; y++) {
                for(let x = -1; x <= 1; x++) {
                    const iy = gy + y;
                    const ix = gx + x;
                    if (iy >= 0 && iy < rows && ix >= 0 && ix < cols) {
                        const idx = iy * cols + ix;
                        grid[idx] = 1;
                        revived = true;
                    }
                }
            }
            if(revived) draw(); // Immediate visual feedback
        }

        window.addEventListener('mousedown', handleInteraction);
        window.addEventListener('touchstart', handleInteraction, { passive: true });

        function draw() {
            ctx.fillStyle = '#121212';
            ctx.fillRect(0, 0, width, height);

            ctx.fillStyle = '#ffa500';
            ctx.beginPath();
            for (let y = 0; y < rows; y++) {
                for (let x = 0; x < cols; x++) {
                    if (grid[y * cols + x] === 1) {
                        ctx.rect(x * cellSize, y * cellSize, cellSize - 1, cellSize - 1);
                    }
                }
            }
            ctx.fill();
        }

        function update() {
            let activeCells = 0;
            
            for (let y = 0; y < rows; y++) {
                const ym1 = (y - 1 + rows) % rows * cols;
                const y0 = y * cols;
                const yp1 = (y + 1 + rows) % rows * cols;
                
                for (let x = 0; x < cols; x++) {
                    const xm1 = (x - 1 + cols) % cols;
                    const xp1 = (x + 1 + cols) % cols;

                    let neighbors = 
                        grid[ym1 + xm1] + grid[ym1 + x] + grid[ym1 + xp1] +
                        grid[y0 + xm1] +                  grid[y0 + xp1] +
                        grid[yp1 + xm1] + grid[yp1 + x] + grid[yp1 + xp1];

                    const cell = grid[y0 + x];
                    const idx = y0 + x;

                    if (cell === 1 && (neighbors < 2 || neighbors > 3)) {
                        nextGrid[idx] = 0;
                    } else if (cell === 0 && neighbors === 3) {
                        nextGrid[idx] = 1;
                    } else {
                        nextGrid[idx] = cell;
                    }
                    if (nextGrid[idx] === 1) activeCells++;
                }
            }
            let temp = grid;
            grid = nextGrid;
            nextGrid = temp;
            return activeCells;
        }

        function gameLoop(timestamp) {
            requestAnimationFrame(gameLoop);

            // Unlocked Loop
            const delta = timestamp - lastTime;
            lastTime = timestamp;

            const population = update();
            draw();
            
            frameCounter++;
            fpsFrameCount++;

            // Update OSD
            if (timestamp - lastFpsUpdate > 500) {
                const fps = Math.round((fpsFrameCount * 1000) / (timestamp - lastFpsUpdate));
                
                osdFps.textContent = fps;
                osdFt.textContent = delta.toFixed(2) + "ms";
                osdAlive.textContent = population;
                
                if (performance && performance.memory) {
                    const used = Math.round(performance.memory.usedJSHeapSize / 1048576);
                    osdMem.textContent = used + " MB";
                } else {
                    osdMem.textContent = "N/A";
                }

                lastFpsUpdate = timestamp;
                fpsFrameCount = 0;
            }

            // Endless Logic
            if (population < 10 || frameCounter % 500 === 0) {
                injectLife();
            }
        }

        window.addEventListener('resize', resize);
        resize();
        requestAnimationFrame(gameLoop);

    </script>
